# Ghostty profile for a terminal operations center.
# Include from main config, e.g.:
#   config-file = ~/.hammerspoon/scripts/ghostty/ghostty-terminal-ops-center.conf

# Visuals
font-size = 13
theme = Catppuccin Mocha
background-opacity = 0.96

# Core navigation
keybind = cmd+enter=new_split:right
keybind = cmd+shift+enter=new_split:down
keybind = cmd+h=goto_split:left
keybind = cmd+j=goto_split:down
keybind = cmd+k=goto_split:up
keybind = cmd+l=goto_split:right
keybind = cmd+shift+z=toggle_split_zoom
keybind = cmd+shift+e=equalize_splits
keybind = cmd+shift+r=reload_config
keybind = cmd+w=close_surface

# Tabs
keybind = cmd+1=goto_tab:1
keybind = cmd+2=goto_tab:2
keybind = cmd+3=goto_tab:3
keybind = cmd+4=goto_tab:4
keybind = cmd+5=goto_tab:5
keybind = cmd+shift+[=previous_tab
keybind = cmd+shift+]=next_tab
